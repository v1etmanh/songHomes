<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t">
  <title id="t">Xe tay ga chạy dọc đường biển Mỹ Khê, phía xa là bán đảo Sơn Trà</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2e4f"/>
      <stop offset=".5" stop-color="#1565a8"/>
      <stop offset=".85" stop-color="#5fb0e3"/>
      <stop offset="1" stop-color="#a9dcf3"/>
    </linearGradient>
    <radialGradient id="sun" cx=".8" cy=".42" r=".35">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".22" stop-color="#d9f1fb" stop-opacity=".5"/>
      <stop offset="1" stop-color="#d9f1fb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9bd8"/>
      <stop offset="1" stop-color="#1565a8"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d3a63"/>
      <stop offset="1" stop-color="#082a49"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe2f1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#sky)"/>
  <rect width="1200" height="520" fill="url(#sun)"/>
  <circle cx="960" cy="200" r="34" fill="#ffffff" opacity=".9"/>

  <!-- clouds -->
  <g fill="#ffffff">
    <g opacity=".22"><ellipse cx="200" cy="110" rx="120" ry="16"/><ellipse cx="255" cy="97" rx="64" ry="18"/></g>
    <g opacity=".16"><ellipse cx="700" cy="70" rx="150" ry="14"/><ellipse cx="650" cy="60" rx="60" ry="14"/></g>
  </g>

  <!-- Sơn Trà peninsula -->
  <path d="M0 300 C 90 250 170 190 260 205 C 330 215 380 170 450 180 C 520 190 560 240 640 262 L 700 280 L 0 300 Z" fill="#0d3a63" opacity=".85"/>
  <path d="M0 300 C 120 270 220 240 320 252 C 420 262 520 268 700 282 L 0 306 Z" fill="#0b2e4f" opacity=".9"/>

  <!-- sea -->
  <rect y="284" width="1200" height="96" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-linecap="round" fill="none" opacity=".5">
    <path d="M80 312 q20 -6 40 0" stroke-width="3"/>
    <path d="M300 330 q24 -7 48 0" stroke-width="3"/>
    <path d="M560 304 q18 -5 36 0" stroke-width="2.5"/>
    <path d="M800 324 q26 -7 52 0" stroke-width="3"/>
    <path d="M1040 308 q20 -6 40 0" stroke-width="2.5"/>
  </g>
  <path d="M760 300 L 1200 300" stroke="#ffffff" stroke-width="2" opacity=".35"/>
  <!-- sun glint on water -->
  <g fill="#ffffff" opacity=".55">
    <rect x="920" y="296" width="80" height="3" rx="1.5"/>
    <rect x="935" y="306" width="50" height="3" rx="1.5"/>
    <rect x="948" y="316" width="26" height="3" rx="1.5"/>
  </g>

  <!-- sand strip -->
  <path d="M0 372 C 300 362 900 362 1200 372 L 1200 392 L 0 392 Z" fill="#d6e6f2"/>

  <!-- palms -->
  <g fill="#0b2e4f">
    <g transform="translate(140 380)">
      <path d="M0 0 C 4 -40 10 -80 22 -118" stroke="#0b2e4f" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M22 -118 C -10 -130 -40 -118 -58 -98 C -30 -112 -6 -114 22 -118 Z"/>
      <path d="M22 -118 C 50 -136 84 -130 100 -108 C 72 -118 48 -120 22 -118 Z"/>
      <path d="M22 -118 C 6 -150 -24 -160 -44 -152 C -16 -146 4 -136 22 -118 Z"/>
      <path d="M22 -118 C 42 -152 74 -160 92 -150 C 66 -146 44 -136 22 -118 Z"/>
      <path d="M22 -118 C 26 -90 18 -66 6 -52 C 12 -76 16 -96 22 -118 Z"/>
    </g>
    <g transform="translate(1070 384) scale(.8)">
      <path d="M0 0 C -4 -40 -10 -80 -22 -118" stroke="#0b2e4f" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M-22 -118 C 10 -130 40 -118 58 -98 C 30 -112 6 -114 -22 -118 Z"/>
      <path d="M-22 -118 C -50 -136 -84 -130 -100 -108 C -72 -118 -48 -120 -22 -118 Z"/>
      <path d="M-22 -118 C -6 -150 24 -160 44 -152 C 16 -146 -4 -136 -22 -118 Z"/>
      <path d="M-22 -118 C -42 -152 -74 -160 -92 -150 C -66 -146 -44 -136 -22 -118 Z"/>
    </g>
  </g>

  <!-- coastal road -->
  <rect y="388" width="1200" height="132" fill="url(#road)"/>
  <g fill="#ffffff" opacity=".55">
    <rect x="30" y="452" width="90" height="6" rx="3"/>
    <rect x="200" y="452" width="90" height="6" rx="3"/>
    <rect x="370" y="452" width="90" height="6" rx="3"/>
    <rect x="880" y="452" width="90" height="6" rx="3"/>
    <rect x="1050" y="452" width="90" height="6" rx="3"/>
  </g>
  <rect y="388" width="1200" height="5" fill="#5fb0e3" opacity=".6"/>

  <!-- motion lines -->
  <g stroke="#a9dcf3" stroke-linecap="round" opacity=".7">
    <path d="M330 404 H 470" stroke-width="4"/>
    <path d="M300 424 H 450" stroke-width="3"/>
    <path d="M350 444 H 480" stroke-width="2.5"/>
  </g>

  <!-- scooter -->
  <g transform="translate(500 300)">
    <!-- wheels -->
    <g>
      <circle cx="40" cy="150" r="34" fill="#061f36"/>
      <circle cx="40" cy="150" r="15" fill="#5f7d96"/>
      <circle cx="230" cy="150" r="34" fill="#061f36"/>
      <circle cx="230" cy="150" r="15" fill="#5f7d96"/>
    </g>
    <!-- body -->
    <path d="M0 132 C 0 96 30 78 70 78 L 150 80 C 160 80 166 88 166 98 L 166 118 L 196 118 L 214 56 C 218 44 230 38 242 40 L 252 42 L 262 108 C 266 128 252 140 234 140 L 196 140 L 176 150 L 72 150 C 30 150 0 150 0 132 Z" fill="url(#body)" stroke="#0b2e4f" stroke-width="3"/>
    <!-- seat -->
    <path d="M40 76 C 50 62 120 60 150 66 C 158 68 160 78 150 80 L 56 82 C 46 82 38 80 40 76 Z" fill="#0b2e4f"/>
    <!-- accent stripe -->
    <path d="M18 116 C 60 108 120 108 166 110" stroke="#1565a8" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- handlebar + mirror -->
    <path d="M238 40 L 226 4" stroke="#0b2e4f" stroke-width="6" stroke-linecap="round"/>
    <path d="M214 2 L 246 0" stroke="#0b2e4f" stroke-width="7" stroke-linecap="round"/>
    <circle cx="252" cy="-10" r="7" fill="#0b2e4f"/>
    <!-- headlight -->
    <path d="M252 52 L 268 58 L 262 72 L 250 68 Z" fill="#ffffff"/>
    <path d="M270 60 L 330 44 L 330 86 Z" fill="#ffffff" opacity=".18"/>

    <!-- rider (back) -->
    <g>
      <path d="M70 70 C 62 40 66 10 86 0 L 112 -4 C 124 6 126 36 118 66 Z" fill="#e11d48"/>
      <circle cx="96" cy="-24" r="20" fill="#f3d2b8"/>
      <path d="M74 -28 C 74 -50 90 -60 104 -58 C 120 -56 126 -42 122 -26 Z" fill="#1565a8"/>
      <path d="M72 -26 L 126 -26" stroke="#0b2e4f" stroke-width="4" stroke-linecap="round"/>
      <path d="M86 66 L 70 116 L 96 118" stroke="#0b2e4f" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- rider (front) -->
    <g>
      <path d="M128 72 C 122 40 130 6 154 -6 L 180 -6 C 192 6 192 40 182 70 Z" fill="#ffffff" stroke="#cfe2f1" stroke-width="2"/>
      <path d="M176 6 C 196 10 210 4 222 2" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round"/>
      <circle cx="166" cy="-30" r="20" fill="#f3d2b8"/>
      <path d="M144 -34 C 144 -56 160 -66 174 -64 C 190 -62 196 -48 192 -32 Z" fill="#0d9488"/>
      <path d="M142 -32 L 196 -32" stroke="#0b2e4f" stroke-width="4" stroke-linecap="round"/>
      <path d="M156 68 L 176 112 L 204 114" stroke="#0b2e4f" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

</svg>
